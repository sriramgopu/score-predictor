  <script>
    function loadScript(src, fallbackSrc) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.async = false;
        script.onload = resolve;
        script.onerror = () => {
          if (fallbackSrc) {
            const fallback = document.createElement('script');
            fallback.src = fallbackSrc;
            fallback.async = false;
            fallback.onload = resolve;
            fallback.onerror = reject;
            document.head.appendChild(fallback);
          } else { reject(new Error('Failed to load ' + src)); }
        };
        document.head.appendChild(script);
      });
    }
    (async function() {
      try {
        await loadScript('https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js','https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js');

    const readBuf  = f => new Promise((r,j)=>{ const rd=new FileReader(); rd.onload=()=>r(rd.result); rd.onerror=j; rd.readAsArrayBuffer(f); });
    const readUrl  = f => new Promise((r,j)=>{ const rd=new FileReader(); rd.onload=()=>r(rd.result); rd.onerror=j; rd.readAsDataURL(f); });
    const readText = f => new Promise((r,j)=>{ const rd=new FileReader(); rd.onload=()=>r(rd.result); rd.onerror=j; rd.readAsText(f); });
    const dlBlob = (blob,name)=>{ const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); };
    const fmtSize = b => b>1048576?`${(b/1048576).toFixed(1)} MB`:b>1024?`${(b/1024).toFixed(0)} KB`:`${b} B`;
    const disposeCanvas = (canvas) => { if(canvas){ canvas.width=0; canvas.height=0; canvas.getContext('2d').clearRect(0,0,0,0); } };
    const ensureScript = (src) => {
      return new Promise((resolve, reject) => {
        if (document.querySelector(`script[src="${src}"]`)) return resolve();
        const s = document.createElement('script');
        s.src = src;
        s.async = false;
        s.onload = resolve;
        s.onerror = () => reject(new Error(`Failed to load ${src}`));
        document.head.appendChild(s);
      });
    };

    const extractText = async (file, onProgress) => {
      if (!window.pdfjsLib) throw new Error('PDF reader not loaded.');
      const pdfjs = window.pdfjsLib;
      if (onProgress) onProgress(10);
      const buf = await readBuf(file);
      const pdf = await pdfjs.getDocument({ data: buf, disableAutoFetch: true, disableStream: true }).promise;
      const n = pdf.numPages;
      let text = "";
      for (let i = 1; i <= n; i++) {
        if (onProgress) onProgress(10 + Math.floor((i / n) * 80));
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(it => it.str).join(" ") + "\n";
        page.cleanup();
        if (i % 5 === 0) await new Promise(r => setTimeout(r, 0));
      }
      return text.trim().slice(0, 12000);
    };

    function detectColumns(items) {
      const xVals = items.map(it => it.transform[4]);
      if (xVals.length < 5) return [items];
      xVals.sort((a,b)=>a-b);
      const gaps = [];
      let prev = xVals[0];
      for (let i=1; i<xVals.length; i++) {
        if (xVals[i] - prev > 30) gaps.push({ start: prev, end: xVals[i] });
        prev = xVals[i];
      }
      if (gaps.length === 0) return [items];
      gaps.sort((a,b)=>(b.end-b.start)-(a.end-a.start));
      const columnThreshold = gaps[0].start + (gaps[0].end - gaps[0].start)/2;
      const left = [], right = [];
      items.forEach(item => {
        if (item.transform[4] < columnThreshold) left.push(item);
        else right.push(item);
      });
      return [left, right];
    }

    async function ensureDocx() { if (!window.docx) await ensureScript('https://unpkg.com/docx@8.2.0/build/index.umd.js'); }
    async function ensureXlsx() { if (!window.XLSX) await ensureScript('https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js'); }
    async function ensurePptx() { if (!window.PptxGenJS) await ensureScript('https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js'); }
    async function ensureMammoth() { if (!window.mammoth) await ensureScript('https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js'); }
    async function ensureHtml2canvas() { if (!window.html2canvas) await ensureScript('https://html2canvas.hertzen.com/dist/html2canvas.min.js'); }

    // ---- PDF Processors (all fully defined) ----
    const pdfToDocx = async (files, opts, prog) => {
      await ensureDocx();
      const pdfjs = window.pdfjsLib; prog(10);
      const buf = await readBuf(files[0]);
      const pdf = await pdfjs.getDocument({ data: buf, disableAutoFetch: true, disableStream: true }).promise;
      const n = pdf.numPages;
      const keepFormatting = opts.layout !== false;
      const { Document, Packer, Paragraph, TextRun, HeadingLevel, Table, TableRow, TableCell, WidthType, ImageRun } = window.docx;
      const docChildren = [];
      for (let i = 1; i <= n; i++) {
        prog(10 + (i/n)*30);
        const page = await pdf.getPage(i);
        const ops = await page.getOperatorList();
        const content = await page.getTextContent();
        const imageObjs = [];
        for (let j = 0; j < ops.fnArray.length; j++) {
          if (ops.fnArray[j] === pdfjsLib.OPS.paintImageXObject) {
            const imgKey = ops.argsArray[j][0];
            try {
              const img = await page.objs.get(imgKey);
              if (img && img.data) imageObjs.push({ data: img.data, width: img.width, height: img.height });
            } catch(e){}
          }
        }
        const items = content.items;
        if (items.length) {
          const columns = detectColumns(items);
          for (const colItems of columns) {
            const linesMap = {};
            colItems.forEach(item => {
              const y = Math.round(item.transform[5] / 2) * 2;
              if (!linesMap[y]) linesMap[y] = [];
              linesMap[y].push(item);
            });
            const sortedYs = Object.keys(linesMap).map(Number).sort((a,b) => b - a);
            if (!keepFormatting) {
              sortedYs.forEach(y => {
                const lineItems = linesMap[y].sort((a,b) => a.transform[4] - b.transform[4]);
                const lineText = lineItems.map(it => it.str).join(' ').trim();
                if (lineText) docChildren.push(new Paragraph({ children: [new TextRun({ text: lineText })] }));
              });
            } else {
              for (const y of sortedYs) {
                const lineItems = linesMap[y].sort((a,b) => a.transform[4] - b.transform[4]);
                const xGaps = [];
                for (let j = 1; j < lineItems.length; j++) {
                  xGaps.push(lineItems[j].transform[4] - lineItems[j-1].transform[4]);
                }
                const isTableRow = lineItems.length >= 2 && Math.max(...xGaps) > 20;
                if (isTableRow) {
                  const lastChild = docChildren[docChildren.length-1];
                  const row = new TableRow({
                    children: lineItems.map(item => new TableCell({
                      children: [new Paragraph({ children: [new TextRun({ text: item.str.trim() })] })],
                      width: { size: 1500, type: WidthType.DXA }
                    }))
                  });
                  if (lastChild instanceof Table) {
                    lastChild.root.push(row);
                  } else {
                    docChildren.push(new Table({ rows: [row] }));
                  }
                } else {
                  const text = lineItems.map(it => it.str).join(' ').trim();
                  if (text) {
                    const isBold = /bold/i.test(lineItems[0].fontName);
                    const isItalic = /italic|oblique/i.test(lineItems[0].fontName);
                    const isHeading = /^(Chapter|Section|\d+\.)\s/i.test(text) || (text.length < 60 && /^[A-Z\s]{4,}$/.test(text));
                    if (isHeading) {
                      docChildren.push(new Paragraph({ heading: HeadingLevel.HEADING_2, children: [new TextRun({ text, bold: true })] }));
                    } else {
                      docChildren.push(new Paragraph({ children: [new TextRun({ text, bold: isBold, italics: isItalic })] }));
                    }
                  }
                }
              }
            }
          }
        }
        for (const imgObj of imageObjs) {
          try {
            docChildren.push(new Paragraph({
              children: [new ImageRun({ data: imgObj.data, transformation: { width: imgObj.width, height: imgObj.height }, type: 'png' })]
            }));
          } catch(e){}
        }
        page.cleanup();
        if (i % 5 === 0) await new Promise(r => setTimeout(r, 0));
      }
      prog(80);
      const doc = new Document({ sections: [{ children: docChildren }] });
      const blob = await Packer.toBlob(doc);
      prog(100);
      return [{ blob, name: files[0].name.replace(/\.pdf$/i,'.docx') }];
    };

    const pdfToExcel = async (files, opts, prog) => {
      await ensureXlsx();
      const pdfjs = window.pdfjsLib; prog(10);
      const buf = await readBuf(files[0]);
      const pdf = await pdfjs.getDocument({ data: buf, disableAutoFetch: true, disableStream: true }).promise;
      const n = pdf.numPages;
      const smartDetection = opts.detect !== false;
      const XLSX = window.XLSX;
      const wb = XLSX.utils.book_new();
      for (let i = 1; i <= n; i++) {
        prog(10 + (i/n)*80);
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        const items = content.items;
        if (!items.length) continue;
        let dataRows;
        if (smartDetection) {
          const yTolerance = 5;
          const rowsMap = {};
          items.forEach(item => {
            const y = Math.round(item.transform[5] / yTolerance) * yTolerance;
            if (!rowsMap[y]) rowsMap[y] = [];
            rowsMap[y].push(item);
          });
          const sortedYs = Object.keys(rowsMap).map(Number).sort((a,b) => b-a);
          const allX = items.map(it => it.transform[4]).sort((a,b)=>a-b);
          const xGap = 10;
          const columnEdges = [];
          columnEdges.push(allX[0]);
          let prevX = allX[0];
          for (let j=1; j<allX.length; j++) {
            if (allX[j] - prevX > xGap) columnEdges.push(allX[j]);
            prevX = allX[j];
          }
          dataRows = sortedYs.map(y => {
            const rowItems = rowsMap[y];
            const row = new Array(columnEdges.length).fill('');
            rowItems.forEach(item => {
              let colIndex = columnEdges.length-1;
              for (let c = columnEdges.length-1; c >= 0; c--) {
                if (item.transform[4] >= columnEdges[c]) { colIndex = c; break; }
              }
              row[colIndex] = (row[colIndex] ? row[colIndex] + ' ' + item.str : item.str);
            });
            return row.map(cell => cell.trim());
          });
        } else {
          const yCoords = items.map(it => Math.round(it.transform[5] / 5) * 5);
          const uniqueY = [...new Set(yCoords)].sort((a,b) => b-a);
          dataRows = uniqueY.map(y => {
            const rowItems = items.filter(it => Math.round(it.transform[5] / 5) * 5 === y).sort((a,b) => a.transform[4] - b.transform[4]);
            return rowItems.map(it => it.str);
          });
        }
        if (dataRows.length) {
          const maxCols = Math.max(...dataRows.map(r => r.length));
          const normalizedRows = dataRows.map(r => { while(r.length < maxCols) r.push(''); return r; });
          const ws = XLSX.utils.aoa_to_sheet(normalizedRows);
          XLSX.utils.book_append_sheet(wb, ws, `Page ${i}`);
        }
        page.cleanup();
        if (i % 5 === 0) await new Promise(r => setTimeout(r, 0));
      }
      prog(95);
      const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      prog(100);
      return [{ blob: new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), name: files[0].name.replace(/\.pdf$/i,'.xlsx') }];
    };

    const paginatedHtmlToPdf = async (html, progCallback) => {
      await ensureHtml2canvas();
      const { PDFDocument } = window.PDFLib;
      const pdfDoc = await PDFDocument.create();
      const pageWidth = 794, pageHeight = 1122, margin = 40;

      container.style.background = '#ffffff';

      const totalHeight = container.scrollHeight;
      while (currentPageY < totalHeight) {
        const clone = container.cloneNode(true);
        clone.style.marginTop = -currentPageY + 'px';
        const wrapper = document.createElement('div');
        wrapper.style.width = contentWidth + 'px';

        document.body.removeChild(wrapper);
        currentPageY += contentHeight;
        if (progCallback) progCallback(Math.min(100, Math.floor((currentPageY / totalHeight) * 100)));
      }
      document.body.removeChild(container);
      return await pdfDoc.save();

    const instantTranslate = (text, from = 'en', to = 'es') => {
      if (from === to) return text;
      const words = text.split(/(\s+|\b)/);
      return words.map(w => {
        const lower = w.toLowerCase().replace(/[.,!?;:]/g, '');
        const translation = dict[lower] && dict[lower][to] ? dict[lower][to] : null;
        return translation ? w.replace(lower, translation) : w;
      }).join('');
    };
    const langToCode = (name) => {
      const m = { 'English': 'en', 'Spanish': 'es', 'French': 'fr', 'German': 'de', 'Italian': 'it', 'Portuguese': 'pt', 'Russian': 'ru', 'Chinese': 'zh', 'Chinese (Simplified)': 'zh', 'Japanese': 'ja', 'Korean': 'ko', 'Arabic': 'ar', 'Hindi': 'hi', 'Auto-detect': 'en' };
      return m[name] || 'en';
    };

    // AI Processors – using the worker for inference
    const workerInference = (messages, max_tokens = 400) => {
      return new Promise((resolve, reject) => {
        const worker = window.aiEngineWorker;
        if (!worker) return reject(new Error('AI not activated'));
        const handler = (e) => {
          if (e.data.type === 'RESULT') {
            worker.removeEventListener('message', handler);
            resolve(e.data.result);
          } else if (e.data.type === 'ERROR') {
            worker.removeEventListener('message', handler);
            reject(new Error(e.data.error));
          }
        };
        worker.addEventListener('message', handler);
        worker.postMessage({ type: 'INFER', payload: { messages, max_tokens } });
      });
    };

    const chatWithPdf = async (files, opts, setProg) => {
      setProg(5);
      const question = opts.question?.trim();
      if (!question) throw new Error("Please enter a question.");
      const txt = await extractText(files[0], (p) => setProg(5 + Math.floor(p * 0.3)));
      if (!txt) throw new Error("No text found in this PDF.");
      setProg(35);
      const chunks = [];
      const sentences = txt.match(/[^.!?\n]+[.!?\n]*/g) || [txt];
      let currentChunk = '';
      for (const s of sentences) {
        if ((currentChunk + s).length > 500 && currentChunk.length > 0) {
          chunks.push(currentChunk.trim());
          currentChunk = s;
        } else currentChunk += ' ' + s;
      }
      if (currentChunk.trim()) chunks.push(currentChunk.trim());
      setProg(40);

      if (window.aiEngineWorker) {
        try {
          const pipe = await window.Transformers.pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');
          const chunkEmbeddings = await Promise.all(chunks.map(c => pipe(c, { pooling: 'mean', normalize: true })));
          const questionEmbedding = await pipe(question, { pooling: 'mean', normalize: true });
          const similarities = chunkEmbeddings.map((emb, i) => ({
            idx: i,
            sim: emb.data.reduce((sum, val, j) => sum + val * questionEmbedding.data[j], 0)
          }));
          similarities.sort((a,b) => b.sim - a.sim);
          const topChunks = similarities.slice(0, 3).map(s => chunks[s.idx]);
          const prompt = `You are a helpful assistant. Answer the following question using ONLY the provided document excerpts. If the answer is not in the text, say so.\n\nDocument excerpts:\n${topChunks.join('\n---\n')}\n\nQuestion: ${question}\nAnswer:`;
          const reply = await workerInference([
            { role: 'system', content: 'You answer questions based on provided document snippets.' },
            { role: 'user', content: prompt }
          ]);
          setProg(100);
          return [{ type: "text", content: reply, name: "answer.txt" }];
        } catch(e) { console.warn('Neural chat failed, falling back', e); }
      }

      const keywords = question.toLowerCase().split(/\W+/).filter(w => w.length > 2);
      const scored = chunks.map(chunk => ({ chunk, score: keywords.reduce((acc, kw) => acc + (chunk.toLowerCase().includes(kw) ? 1 : 0), 0) }));
      scored.sort((a,b) => b.score - a.score);
      const best = scored.slice(0, 2).map(s => s.chunk).join('\n\n');
      setProg(100);
      return [{ type: "text", content: best || "No relevant information found.", name: "answer.txt", warning: "AI engine unavailable." }];
    };

    const aiProcessors = {
      "ai-sum": async (files, opts, setProg) => {
        setProg(5);
        const txt = await extractText(files[0], (p) => setProg(5 + Math.floor(p * 0.5)));
        setProg(55);
        if (window.aiEngineWorker) {
          try {
            const reply = await workerInference([{ role: 'user', content: `Summarize the following document concisely (${opts.len}):\n\n${txt.slice(0, 12000)}` }], 300);
            setProg(100);
            return [{ type: "text", content: reply, name: "summary.txt" }];
          } catch(e){}
        }
        const len = opts.len === 'Brief' ? 2 : (opts.len === 'Detailed' ? 5 : 3);
        const summary = extractiveSummary(txt, len);
        setProg(100);
        return [{ type: "text", content: summary, name: "summary.txt", warning: "AI offline – extractive summary." }];
      },
      "ai-trans": async (files, opts, setProg) => {
        setProg(5);
        const txt = await extractText(files[0], (p) => setProg(5 + Math.floor(p * 0.5)));
        setProg(55);
        if (window.aiEngineWorker) {
          try {
            const reply = await workerInference([{ role: 'user', content: `Translate the following text from ${opts.from} to ${opts.to}:\n\n${txt.slice(0, 10000)}` }], 800);
            setProg(100);
            return [{ type: "text", content: reply, name: "translated.txt" }];
          } catch(e){}
        }
        const fromCode = opts.from === 'Auto-detect' ? 'en' : langToCode(opts.from);
        const toCode = langToCode(opts.to);
        const result = instantTranslate(txt, fromCode, toCode);
        setProg(100);
        return [{ type: "text", content: result, name: "translated.txt", warning: "Using basic dictionary translation." }];
      },
      "ai-analyze": async (files, opts, setProg) => {
        setProg(5);
        const txt = await extractText(files[0], (p) => setProg(5 + Math.floor(p * 0.5)));
        setProg(55);
        if (window.aiEngineWorker) {
          try {
            const reply = await workerInference([{ role: 'user', content: `Analyze this document. Provide key topics, sentiment, and important entities.\n\n${txt.slice(0, 10000)}` }], 400);
            setProg(100);
            return [{ type: "text", content: reply, name: "insights.txt" }];
          } catch(e){}
        }
        const analysis = fallbackAnalyze(txt);
        setProg(100);
        return [{ type: "text", content: analysis, name: "insights.txt", warning: "Using basic keyword analysis." }];
      },
      "ai-chat": chatWithPdf,
    };

    const ReorderModal = ({ file, onSave, onCancel }) => {
      const [pages, setPages] = useState([]);
      const [loading, setLoading] = useState(true);
      const [dragIdx, setDragIdx] = useState(null);
      useEffect(() => {
        (async () => {
          const pdfjs = window.pdfjsLib;
          const buf = await readBuf(file);
          const pdf = await pdfjs.getDocument({ data: buf }).promise;
          const n = pdf.numPages;
          const thumbs = [];
          for (let i = 1; i <= n; i++) {
            const page = await pdf.getPage(i);
            const vp = page.getViewport({ scale: 0.4 });
            const canvas = document.createElement('canvas'); canvas.width = vp.width; canvas.height = vp.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
            thumbs.push({ idx: i-1, dataUrl: canvas.toDataURL() });
          }
          setPages(thumbs); setLoading(false);
        })();
      }, [file]);
      const movePage = (from, to) => { const arr = [...pages]; const [item] = arr.splice(from,1); arr.splice(to,0,item); setPages(arr); };
      const handleSave = async () => {
        const { PDFDocument } = window.PDFLib;
        const srcDoc = await PDFDocument.load(await readBuf(file));
        const newDoc = await PDFDocument.create();
        for (const { idx } of pages) { const [copied] = await newDoc.copyPages(srcDoc, [idx]); newDoc.addPage(copied); }
        const b = await newDoc.save();
        onSave(new Blob([b], { type: "application/pdf" }));
      };
      if (loading) return React.createElement('div',{style:{textAlign:"center",padding:20}},"Loading pages…");
      return React.createElement('div',{style:{position:"fixed",inset:0,background:"#000000aa",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200}},
        React.createElement('div',{style:{background:T.bgCard,borderRadius:16,padding:24,width:"90%",maxWidth:800,maxHeight:"80vh",overflowY:"auto"}},
          React.createElement('h2',{style:{color:T.text}},"Reorder Pages"),

          React.createElement('div',{style:{display:"flex",flexWrap:"wrap",gap:12}},
            pages.map((p,i)=>React.createElement('div',{key:i,draggable:true,
              onDragStart:()=>setDragIdx(i), onDragOver:e=>e.preventDefault(),
              onDrop:()=>{if(dragIdx!==null&&dragIdx!==i)movePage(dragIdx,i);setDragIdx(null);},
              style:{width:120,border:`2px solid ${i===dragIdx?T.primary:T.border}`,borderRadius:8,overflow:"hidden",cursor:"grab",background:T.bgInput,textAlign:"center"}},
              React.createElement('img',{src:p.dataUrl,style:{width:"100%"},alt:`Page ${i+1}`}),
              React.createElement('div',{style:{padding:"4px 0",fontSize:11,color:T.textSub}},i+1)))
          ),
          React.createElement('div',{style:{marginTop:20,display:"flex",gap:12,justifyContent:"flex-end"}},
            React.createElement('button',{onClick:onCancel,style:{background:"transparent",border:`1px solid ${T.border}`,borderRadius:8,padding:"8px 20px",color:T.textSub,cursor:"pointer"}},"Cancel"),
            React.createElement('button',{onClick:handleSave,style:{background:T.grad,border:"none",borderRadius:8,padding:"8px 20px",color:"white",cursor:"pointer",fontWeight:600}},"Save Order")
          )
        )
      );
    };

      const [neuralProg, setNeuralProg] = useState(0);
      const [aiStatus, setAiStatus] = useState('idle');
      const [aiError, setAiError] = useState('');
      const aiWorkerRef = useRef(null);

      const loadAI = useCallback(() => {
        if (aiStatus === 'loading' || aiStatus === 'ready') return;
        setAiStatus('loading');
        setAiError('');
        setNeuralProg(0);
        const worker = new Worker(aiWorkerURL, { type: 'module' });
        aiWorkerRef.current = worker;
        worker.onmessage = (e) => {
          const { type, detail, error } = e.data;
          if (type === 'PROGRESS') {
            setNeuralProg(detail);
          } else if (type === 'READY') {
            setAiStatus('ready');
            window.neuralAIReady = true;
            window.aiEngineWorker = worker;
          } else if (type === 'OFFLINE') {
            setAiStatus('idle');
            setNeuralProg(0);
            window.neuralAIReady = false;
            window.aiEngineWorker = null;
            if (aiWorkerRef.current) {
              aiWorkerRef.current.terminate();
              aiWorkerRef.current = null;
            }
          } else if (type === 'ERROR') {
            setAiStatus('error');
            setAiError(error);
            window.neuralAIReady = false;
            window.aiEngineWorker = null;
            if (aiWorkerRef.current) {
              aiWorkerRef.current.terminate();
              aiWorkerRef.current = null;
            }
          }
        };
        worker.postMessage({ type: 'ACTIVATE' });
      }, [aiStatus]);

      const deactivateAI = useCallback(() => {
        if (aiWorkerRef.current) {
          aiWorkerRef.current.postMessage({ type: 'DEACTIVATE' });
        }
      }, []);

      useEffect(() => {
        const handler = (e) => setNeuralProg(e.detail);
        window.addEventListener('aiProgress', handler);
        return () => window.removeEventListener('aiProgress', handler);
      }, []);

      return (
        <div style={{position:"sticky",top:0,zIndex:100,background:T.bgCard+"EE",backdropFilter:"blur(12px)",borderBottom:`1px solid ${T.border}`,padding:"0 24px",height:60,display:"flex",alignItems:"center"}}>
          <button onClick={onHome} style={{background:"none",border:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:32,height:32,background:T.grad,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center"}}><FileText size={16} color="white"/></div>
            <span style={{fontWeight:800,fontSize:17,color:T.text}}>SGN PDF<span style={{color:T.primary}}>House</span></span>
          </button>
          <div style={{flex:1}} />
          {aiStatus === 'idle' && (
            <button onClick={loadAI} style={{ background: T.ai, border: 'none', borderRadius: 6, padding: '5px 12px', color: 'white', cursor: 'pointer', fontSize: 12, fontWeight: 600 }}>
              Activate AI
            </button>
          )}
          {aiStatus === 'loading' && <span style={{ color: T.textSub, fontSize: 12 }}>AI Model: {neuralProg}%</span>}
          {aiStatus === 'ready' && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <Badge color={T.success}>AI Ready</Badge>
              <button onClick={deactivateAI} style={{ background: 'transparent', border: `1px solid ${T.border}`, borderRadius: 6, padding: '4px 10px', color: T.textSub, cursor: 'pointer', fontSize: 11 }}>
                Deactivate
              </button>
            </div>
          )}
          {aiStatus === 'error' && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span title={aiError} onClick={() => alert('AI Error: ' + aiError)} style={{ color: T.err, fontSize: 12, cursor: 'pointer' }}>AI failed</span>
              <button onClick={loadAI} style={{ background: T.bgCard, border: `1px solid ${T.border}`, borderRadius: 4, padding: '2px 8px', color: T.textSub, fontSize: 10, cursor: 'pointer' }}>Retry</button>
            </div>
          )}
        </div>
      );
    };

    const App = () => {
      const [view,setView] = useState("home");
      const [tool,setTool] = useState(null);
      const select = t => { setTool(t); window.history.pushState(null,'','/tool/'+t.id); setView("tool"); window.scrollTo(0,0); };
      useEffect(() => {
        const handlePath = () => {
          const path = window.location.pathname;
          if (path.startsWith('/tool/')) {
            const id = path.replace('/tool/','');
            const found = TOOLS.find(t => t.id === id);
            if (found) { setTool(found); setView('tool'); return; }
          }
          if (['/about','/privacy','/terms','/contact'].includes(path)) {
            setView(path.slice(1)); return;
          }
          setView('home');
          setTool(null);
        };
        window.addEventListener('popstate', handlePath);
        handlePath();
        return () => window.removeEventListener('popstate', handlePath);
      }, []);

      useEffect(() => {
        if (view === 'tool' && tool) {
          document.title = tool.name + ' – SGN PDF House';
          const meta = document.querySelector('meta[name="description"]');
          if (meta) meta.setAttribute('content', tool.desc + ' | SGN PDF House – Private, free PDF tools.');
        } else if (['about','privacy','terms','contact'].includes(view)) {
          const titles = { about:'About', privacy:'Privacy Policy', terms:'Terms of Service', contact:'Contact' };
          document.title = titles[view] + ' – SGN PDF House';
          const meta = document.querySelector('meta[name="description"]');
          if (meta) meta.setAttribute('content', 'SGN PDF House – Free private PDF suite. ' + titles[view] + '.');
        } else {
          document.title = 'SGN PDF House – Free Private PDF Suite';
          const meta = document.querySelector('meta[name="description"]');
          if (meta) meta.setAttribute('content', '40+ PDF tools, completely private, no uploads. Convert, merge, split, compress, OCR, AI chat with your PDF, and more.');
        }
      }, [view, tool]);

      useEffect(()=>{const h=e=>select(e.detail);document.addEventListener("selectTool",h);return ()=>document.removeEventListener("selectTool",h);},[]);

      return React.createElement('div',{style:{minHeight:"100vh",position:"relative",zIndex:1}},
        React.createElement(Header,{onHome:()=>{ window.history.pushState(null,'','/'); setView('home'); }}),
        React.createElement('div',{style:{animation:"fadeIn 0.3s ease"}},
          view==="home"&&React.createElement(HomePage,{onSelect:select}),
          view==="tool"&&tool&&React.createElement(ToolPage,{tool,onBack:()=>{ window.history.pushState(null,'','/'); setView('home'); }}),
          view==="about"&&React.createElement(AboutPage,{onBack:()=>{ window.history.pushState(null,'','/'); setView('home'); }}),
          view==="privacy"&&React.createElement(PrivacyPage,{onBack:()=>{ window.history.pushState(null,'','/'); setView('home'); }}),
          view==="terms"&&React.createElement(TermsPage,{onBack:()=>{ window.history.pushState(null,'','/'); setView('home'); }}),
          view==="contact"&&React.createElement(ContactPage,{onBack:()=>{ window.history.pushState(null,'','/'); setView('home'); }})
        )
      );
    };

    ReactDOM.render(React.createElement(App), document.getElementById('root'));
  </script>
</body>
</html>
