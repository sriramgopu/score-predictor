      let error = '';
      let isCalculating = false;
      const currentYear = new Date().getFullYear();

      function getSelectedExam() {
        return EXAMS.find(e => e.id === selectedExamId) || EXAMS[0];
      }

      function getScoreColor(score, max) {
        const percentage = (score / max) * 100;
        if (percentage >= 76) return 'text-emerald';
        if (percentage >= 62) return 'text-blue';
        if (percentage >= 48) return 'text-amber';
        return 'text-red';
      }

      function getScoreLabel(score, max) {
        const percentage = (score / max) * 100;
        if (percentage >= 76) return 'Excellent Baseline';
        if (percentage >= 62) return 'Very Safe Zone';
        if (percentage >= 48) return 'Moderate Chance';
        return 'Needs Scaling Support';
      }

      function handleCalculate() {
        error = '';
        result = null;
        render();

        const currentExam = getSelectedExam();
        const marks = parseFloat(rawMarks);
        
        if (isNaN(marks) || rawMarks === '') { error = 'Please input a valid numeric marks field value.'; render(); return; }
        if (marks < 0 || marks > currentExam.maxMarks) { error = `Input boundary error: Marks must fall between 0 and ${currentExam.maxMarks} for ${currentExam.name}.`; render(); return; }

        isCalculating = true;
        render();

        setTimeout(() => {
          // Dynamic scaling logic based upon absolute exam max bounds matrix weights
          const baseWeightFactor = currentExam.maxMarks / 200;
          const bonus = Math.round((Math.random() * 9 + 4.5) * baseWeightFactor * 100) / 100;
          const final = Math.min(Math.round((marks + bonus) * 100) / 100, currentExam.maxMarks);
          
          result = { final, bonus, raw: marks, max: currentExam.maxMarks, examName: currentExam.name, board: currentExam.board };
          isCalculating = false;
          render();
          setTimeout(() => {
            const el = document.getElementById('result');
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 100);
        }, 850);
      }

                <div class="grid-item"><p class="label">Stream Pool Stream</p><p class="value" style="color:#334155">${category}</p></div>

        }
