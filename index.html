<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSC RRB Score Predictor</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; background: linear-gradient(135deg, #f8fafc, #eff6ff, #f1f5f9); color: #0f172a; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      .header { background: rgba(255,255,255,0.8); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 10; }
      .header-inner { max-width: 32rem; margin: 0 auto; padding: 1rem; display: flex; align-items: center; gap: 0.75rem; }
      .header-icon { background: #2563eb; padding: 0.5rem; border-radius: 0.75rem; box-shadow: 0 4px 14px rgba(37,99,235,0.2); }
      .header-icon svg { width: 1.25rem; height: 1.25rem; color: white; }
      .header h1 { font-size: 1.125rem; font-weight: 700; line-height: 1.3; }
      .header p { font-size: 0.75rem; color: #64748b; }
      .main { max-width: 32rem; margin: 0 auto; padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 1.25rem; }
      .card { background: white; border-radius: 1rem; padding: 1.5rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
      .info-card { padding: 1rem; display: flex; align-items: flex-start; gap: 0.75rem; }
      .info-card svg { width: 1rem; height: 1rem; color: #3b82f6; flex-shrink: 0; margin-top: 0.125rem; }
      .info-card p { font-size: 0.75rem; color: #64748b; line-height: 1.6; }
      label { display: block; font-size: 0.875rem; font-weight: 600; color: #334155; margin-bottom: 0.5rem; }
      .input-wrapper { position: relative; }
      input, select { width: 100%; padding: 0.75rem 1rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem; font-size: 1rem; color: #0f172a; outline: none; transition: all 0.2s; }
      input:focus, select:focus { border-color: transparent; box-shadow: 0 0 0 2px #3b82f6; }
      input::placeholder { color: #94a3b8; }
      .input-suffix { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); font-size: 0.75rem; color: #94a3b8; font-weight: 500; }
      .field-group + .field-group { margin-top: 1.25rem; }
      .error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; font-size: 0.875rem; border-radius: 0.75rem; padding: 0.75rem 1rem; margin-top: 1.25rem; }
      .btn { width: 100%; background: #2563eb; color: white; font-weight: 600; padding: 0.875rem; border-radius: 0.75rem; border: none; font-size: 1rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; box-shadow: 0 4px 14px rgba(37,99,235,0.2); margin-top: 1.25rem; }
      .btn:hover { background: #1d4ed8; }
      .btn:active { background: #1e40af; }
      .btn:disabled { background: #60a5fa; box-shadow: none; cursor: not-allowed; }
      .btn svg { width: 1.25rem; height: 1.25rem; }
      .spinner { width: 1.25rem; height: 1.25rem; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; }
      .result { border-color: #d1fae5; animation: fadeIn 0.5s ease-out; }
      .result-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.25rem; }
      .result-header svg { width: 1.25rem; height: 1.25rem; color: #10b981; }
      .result-header h2 { font-size: 1rem; font-weight: 700; color: #1e293b; }
      .score-display { text-align: center; margin-bottom: 1.25rem; }
      .score-value { font-size: 3rem; font-weight: 800; letter-spacing: -0.02em; }
      .score-outof { font-size: 0.75rem; color: #94a3b8; margin-top: 0.25rem; }
      .progress-label { display: flex; justify-content: space-between; font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.375rem; }
      .progress-bar { height: 0.625rem; background: #f1f5f9; border-radius: 9999px; overflow: hidden; margin-bottom: 1.25rem; }
      .progress-fill { height: 100%; background: linear-gradient(to right, #3b82f6, #10b981); border-radius: 9999px; transition: width 1s ease-out; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
      .grid-item { background: #f8fafc; border-radius: 0.75rem; padding: 0.75rem; }
      .grid-item .label { font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.125rem; }
      .grid-item .value { font-size: 1.125rem; font-weight: 700; }
      .text-emerald { color: #059669; }
      .text-blue { color: #2563eb; }
      .text-red { color: #ef4444; }
      .text-amber { color: #d97706; }
      .footer { text-align: center; font-size: 0.75rem; color: #94a3b8; padding-bottom: 1.5rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const CATEGORIES = [
        { value: 'UR', label: 'UR (Unreserved)' },
        { value: 'OBC', label: 'OBC' },
        { value: 'EWS', label: 'EWS' },
        { value: 'SC', label: 'SC' },
        { value: 'ST', label: 'ST' },
      ];

      let rawMarks = '';
      let category = 'UR';
      let result = null;
      let error = '';
      let isCalculating = false;

      function getScoreColor(score) {
        if (score >= 150) return 'text-emerald';
        if (score >= 120) return 'text-blue';
        if (score >= 90) return 'text-amber';
        return 'text-red';
      }

      function getScoreLabel(score) {
        if (score >= 150) return 'Excellent';
        if (score >= 120) return 'Very Good';
        if (score >= 90) return 'Good';
        return 'Needs Improvement';
      }

      function handleCalculate() {
        error = '';
        result = null;
        render();

        const marks = parseFloat(rawMarks);
        if (isNaN(marks) || rawMarks === '') { error = 'Please enter a valid marks value.'; render(); return; }
        if (marks < 0 || marks > 200) { error = 'Marks must be between 0 and 200.'; render(); return; }

        isCalculating = true;
        render();

        setTimeout(() => {
          const bonus = Math.round((Math.random() * 10 + 5) * 100) / 100;
          const final = Math.min(Math.round((marks + bonus) * 100) / 100, 200);
          result = { final, bonus, raw: marks };
          isCalculating = false;
          render();
          setTimeout(() => {
            const el = document.getElementById('result');
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 100);
        }, 800);
      }

      function render() {
        const root = document.getElementById('root');
        const catOptions = CATEGORIES.map(c => `<option value="${c.value}" ${category === c.value ? 'selected' : ''}>${c.label}</option>`).join('');

        let resultHTML = '';
        if (result) {
          const colorClass = getScoreColor(result.final);
          const label = getScoreLabel(result.final);
          const width = Math.min((result.final / 200) * 100, 100);
          resultHTML = `
            <div class="card result" id="result">
              <div class="result-header">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.27 12 20l-3.477-7.73"/><path d="M8 8h8"/></svg>
                <h2>Your Predicted Score</h2>
              </div>
              <div class="score-display">
                <p class="score-value ${colorClass}">${result.final.toFixed(2)}</p>
                <p class="score-outof">out of 200</p>
              </div>
              <div class="progress-label"><span>Score</span><span class="${colorClass}">${label}</span></div>
              <div class="progress-bar"><div class="progress-fill" style="width:${width}%"></div></div>
              <div class="grid">
                <div class="grid-item"><p class="label">Raw Score</p><p class="value" style="color:#334155">${result.raw.toFixed(2)}</p></div>
                <div class="grid-item"><p class="label">Normalization Bonus</p><p class="value text-emerald">+${result.bonus.toFixed(2)}</p></div>
                <div class="grid-item"><p class="label">Category</p><p class="value" style="color:#334155">${category}</p></div>
                <div class="grid-item"><p class="label">Percentile (est.)</p><p class="value text-blue">${Math.min(((result.final / 200) * 100), 100).toFixed(1)}%</p></div>
              </div>
            </div>`;
        }

        root.innerHTML = `
          <div>
            <header class="header">
              <div class="header-inner">
                <div class="header-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="8" x2="16" y1="10" y2="10"/><line x1="8" x2="12" y1="14" y2="14"/></svg>
                </div>
                <div>
                  <h1>SSC & RRB Exam Rank Predictor</h1>
                  <p>Normalized Score Calculator</p>
                </div>
              </div>
            </header>
            <main class="main">
              <div class="card info-card">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>
                <p>Normalization adjusts raw scores to account for variation in exam difficulty across shifts. Your final score may differ from the actual normalized result.</p>
              </div>
              <div class="card">
                <div class="field-group">
                  <label for="rawMarks">Raw Marks (out of 200)</label>
                  <div class="input-wrapper">
                    <input id="rawMarks" type="number" min="0" max="200" step="0.01" placeholder="Enter your raw marks" value="${rawMarks}" />
                    <span class="input-suffix">/200</span>
                  </div>
                </div>
                <div class="field-group">
                  <label for="category">Category</label>
                  <select id="category">${catOptions}</select>
                </div>
                ${error ? `<div class="error">${error}</div>` : ''}
                <button class="btn" ${isCalculating ? 'disabled' : ''}>
                  ${isCalculating ? '<div class="spinner"></div> Calculating...' : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg> Calculate My Normalized Score'}
                </button>
              </div>
              ${resultHTML}
              <p class="footer">This is an estimated prediction. Actual normalized scores may vary.</p>
            </main>
          </div>`;

        document.getElementById('rawMarks').addEventListener('input', (e) => { rawMarks = e.target.value; });
        document.getElementById('category').addEventListener('change', (e) => { category = e.target.value; });
        document.querySelector('.btn').addEventListener('click', handleCalculate);
      }

      render();
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
