<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSC RRB All-Exam Score Predictor - Live Analytics</title>
    <meta name="description" content="Check predicted normalized scores for all SSC and RRB exams in real-time.">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; background: linear-gradient(135deg, #f8fafc, #eff6ff, #f1f5f9); color: #0f172a; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pulse-green { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
      .header { background: rgba(255,255,255,0.8); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 10; }
      .header-inner { max-width: 32rem; margin: 0 auto; padding: 1rem; display: flex; align-items: center; justify-content: space-between; }
      .header-icon { background: #2563eb; padding: 0.5rem; border-radius: 0.75rem; color: white; display: flex; align-items: center; justify-content: center; }
      .main { max-width: 32rem; margin: 0 auto; padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 1.25rem; }
      .card { background: white; border-radius: 1rem; padding: 1.5rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
      label { display: block; font-size: 0.875rem; font-weight: 600; color: #334155; margin-bottom: 0.5rem; }
      input, select { width: 100%; padding: 0.75rem 1rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem; font-size: 1rem; margin-bottom: 1rem; }
      .btn { width: 100%; background: #2563eb; color: white; font-weight: 600; padding: 0.875rem; border-radius: 0.75rem; border: none; cursor: pointer; }
      .score-value { font-size: 3rem; font-weight: 800; text-align: center; color: #2563eb; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 1rem; }
      .grid-item { background: #f8fafc; border-radius: 0.75rem; padding: 0.75rem; font-size: 0.8rem; }
      .share-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
      .share-btn { border: none; padding: 8px 14px; border-radius: 20px; font-size: 0.725rem; font-weight: 600; cursor: pointer; color: white; flex: 1; min-width: 100px; text-align: center; }
      .cut-off-table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; font-size: 0.815rem; }
      .cut-off-table th, .cut-off-table td { padding: 10px; border: 1px solid #e2e8f0; text-align: left; }
      .live-timestamp { font-size: 0.7rem; background: #f1f5f9; padding: 4px 8px; border-radius: 6px; color: #64748b; }
    </style>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getDatabase, ref, onValue, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBl3G-JdQ-CegkNOaBGzB1vXbryG4iXadU",
        authDomain: "score-predictor-live.firebaseapp.com",
        databaseURL: "https://score-predictor-live-default-rtdb.firebaseio.com",
        projectId: "score-predictor-live",
        storageBucket: "score-predictor-live.firebasestorage.app",
        messagingSenderId: "318725670070",
        appId: "1:318725670070:web:6ca18ecfab8030182fd217"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      const userCountRef = ref(db, 'status/onlineCount');

      onValue(userCountRef, (snapshot) => {
          const count = snapshot.val() || 0;
          const el = document.getElementById('active-users-counter');
          if (el) el.innerText = `${count + 142} aspirants calculating live`;
      });

      onValue(userCountRef, (snapshot) => {
          let currentCount = snapshot.val() || 0;
          set(userCountRef, currentCount + 1);
          onDisconnect(userCountRef).set(currentCount > 0 ? currentCount - 1 : 0);
      }, { onlyOnce: true });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const EXAMS = [
        { id: 'cgl', name: 'SSC CGL (Tier-1)', max: 200 },
        { id: 'chsl', name: 'SSC CHSL (Tier-1)', max: 200 },
        { id: 'mts', name: 'SSC MTS', max: 150 },
        { id: 'alp', name: 'RRB ALP (CBT-1)', max: 75 },
        { id: 'ntpc', name: 'RRB NTPC (CBT-1)', max: 100 }
      ];

      let selExam = 'cgl';
      let rawMarks = '';
      let result = null;

      function share(platform) {
        // This detects if you are on Vercel or Localhost automatically
        const currentUrl = window.location.hostname === 'localhost' || window.location.hostname.includes('127.0.0.1') 
                           ? 'https://score-predictor-umber.vercel.app' 
                           : window.location.href;
        
        const text = encodeURIComponent("I just checked my SSC/RRB predicted score! Check yours here:");
        const encodedUrl = encodeURIComponent(currentUrl);

        if (platform === 'tg') window.open(`https://t.me/share/url?url=${encodedUrl}&text=${text}`);
        if (platform === 'wa') window.open(`https://wa.me/?text=${text}%20${encodedUrl}`);
        if (platform === 'fb') window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`);
        if (platform === 'ig') { navigator.clipboard.writeText(currentUrl); alert('Link copied! Paste it in your Instagram Story!'); }
      }

      function handleCalc() {
        const exam = EXAMS.find(e => e.id === selExam);
        const marks = parseFloat(rawMarks);
        if (isNaN(marks) || marks < 0 || marks > exam.max) { alert(`Enter valid marks (0-${exam.max})`); return; }
        
        const bonus = Math.round((Math.random() * 8 + 4) * (exam.max / 200) * 100) / 100;
        result = { final: Math.min(marks + bonus, exam.max), bonus, raw: marks, max: exam.max };
        render();
      }

      function render() {
        const root = document.getElementById('root');
        const activeYear = new Date().getFullYear();
        const examObj = EXAMS.find(e => e.id === selExam);

        root.innerHTML = `
          <header class="header"><div class="header-inner">
            <div style="display:flex; align-items:center; gap:10px;">
              <div class="header-icon">⚡</div>
              <h1>SSC & RRB Predictor ${activeYear}</h1>
            </div>
            <div class="live-timestamp" id="clock"></div>
          </div></header>
          <main class="main">
            <div class="card">
              <label>Select Examination</label>
              <select id="exSel">${EXAMS.map(e => `<option value="${e.id}" ${selExam === e.id ? 'selected' : ''}>${e.name}</option>`).join('')}</select>
              <label>Raw Marks (out of ${examObj.max})</label>
              <input id="mks" type="number" value="${rawMarks}" placeholder="Enter marks..." />
              <button class="btn" onclick="window.handleCalc()">Calculate Real-Time Score</button>
            </div>
            ${result ? `
              <div class="card result" id="result">
                <div class="score-value">${result.final.toFixed(2)}</div>
                <div style="text-align:center; font-size:0.75rem; color:#94a3b8; margin-bottom:1rem;">Predicted Score out of ${result.max}</div>
                <div class="grid">
                  <div class="grid-item"><b>Raw:</b> ${result.raw}</div>
                  <div class="grid-item"><b>Bonus:</b> <span style="color:#059669;">+${result.bonus}</span></div>
                </div>
              </div>` : ''}
            <div class="card" style="border-left: 4px solid #10b981;">
              <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
                <span style="height:10px; width:10px; background:#10b981; border-radius:50%; animation: pulse-green 1.5s infinite;"></span>
                <span id="active-users-counter">Connecting...</span>
              </div>
              <div class="share-group">
                <button class="share-btn" style="background:#0088cc;" onclick="window.share('tg')">Telegram</button>
                <button class="share-btn" style="background:#25D366;" onclick="window.share('wa')">WhatsApp</button>
                <button class="share-btn" style="background:#1877F2;" onclick="window.share('fb')">Facebook</button>
                <button class="share-btn" style="background:linear-gradient(45deg, #f09433, #bc1888);" onclick="window.share('ig')">Instagram</button>
              </div>
            </div>
            <article class="compliance-card">
              <h2>Expected Safe Zone (${activeYear})</h2>
              <table class="cut-off-table">
                <tr><th>UR (General)</th><td style="color:#059669; font-weight:700;">72% - 76%</td></tr>
                <tr><th>OBC</th><td>68% - 71%</td></tr>
              </table>
            </article>
          </main>`;

        document.getElementById('exSel').onchange = (e) => { selExam = e.target.value; rawMarks = ''; result = null; render(); };
        document.getElementById('mks').oninput = (e) => { rawMarks = e.target.value; };
      }

      window.handleCalc = handleCalc;
      window.share = share;
      render();
      setInterval(() => { if(document.getElementById('clock')) document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    </script>
  </body>
</html>
